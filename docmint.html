<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocMint - Pro Workspace</title>
    
    <!-- External Dependencies (CDNs) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --primary-red: #ff4d4d; /* Specific red from your design */
            --primary-red-hover: #e60000;
            --sidebar-bg: #ffffff;
            --main-bg: #f8f9fa;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e0e0;
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--main-bg);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden; /* Prevent body scroll, handle in containers */
        }

        /* --- LAYOUT --- */
        .app-container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        /* Brand / Logo Area */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-placeholder {
            width: 48px;
            height: 48px;
            background-color: #f1f3f4;
            border-radius: 12px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-red);
            font-size: 24px;
        }

        .brand-header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider {
            height: 1px;
            background-color: #f0f0f0;
            border: none;
            margin: 0 0 24px 0;
        }

        /* Tools Menu Section */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Custom Select Dropdown */
        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .select-wrapper {
            position: relative;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #fff;
            color: var(--text-dark);
            appearance: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            outline: none;
            border-color: var(--primary-red);
        }

        .select-wrapper::after {
            content: '\f107'; /* FontAwesome chevron-down */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 12px;
        }

        /* Tool List (Radio Buttons) */
        .tool-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tool-item {
            position: relative;
            cursor: pointer;
        }

        .tool-item input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .tool-card {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
            color: #555;
            font-size: 14px;
        }

        .tool-card:hover {
            background-color: #fefefe;
            color: #000;
        }

        /* Selected State */
        .tool-item input[type="radio"]:checked + .tool-card {
            background-color: #fff0f0; /* Very light red bg */
            color: var(--primary-red);
            font-weight: 500;
        }

        .tool-card .icon {
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        /* --- MAIN WORKSPACE --- */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--main-bg);
            overflow: hidden;
        }

        .top-bar {
            height: 70px;
            background-color: #fff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 32px;
            flex-shrink: 0;
        }

        .top-bar h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .content-scroll {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        /* Tool Interface (Placeholder UI) */
        .tool-interface {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            padding: 40px;
            text-align: center;
        }

        .upload-zone {
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            padding: 60px 20px;
            margin: 24px 0;
            transition: border-color 0.3s;
            cursor: pointer;
            background-color: #fafafa;
        }

        .upload-zone:hover {
            border-color: var(--primary-red);
            background-color: #fffdfd;
        }

        .upload-icon {
            font-size: 48px;
            color: #ccc;
            margin-bottom: 16px;
        }

        .btn-primary {
            background-color: var(--primary-red);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background-color: var(--primary-red-hover);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                transform: translateX(-100%);
                height: 100%;
                z-index: 100;
                transition: transform 0.3s;
            }
            .sidebar.active {
                transform: translateX(0);
                box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            }
            .mobile-toggle {
                display: block;
                margin-right: 15px;
                font-size: 20px;
                cursor: pointer;
            }
        }
        @media (min-width: 769px) {
            .mobile-toggle {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand-header">
                <div class="logo-placeholder">
                    <i class="fas fa-layer-group"></i>
                </div>
                <h1>DocMint</h1>
                <p class="subtitle">Pro Workspace</p>
            </div>

            <hr class="divider">

            <div class="input-group">
                <div class="section-title">
                    <i class="fas fa-tools"></i> Tools Menu
                </div>
                <label class="input-label">Select Category</label>
                <div class="select-wrapper">
                    <select id="categorySelect">
                        <option value="image">Image Tools</option>
                        <option value="pdf">PDF Tools</option>
                    </select>
                </div>
            </div>

            <div class="input-label" style="margin-bottom: 10px;">Available Tools</div>
            <div id="toolList" class="tool-list">
                <!-- JavaScript will inject radio buttons here -->
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <header class="top-bar">
                <i class="fas fa-bars mobile-toggle" id="menuToggle"></i>
                <h2 id="currentToolTitle">Select a Tool</h2>
            </header>
            
            <div class="content-scroll">
                <div id="workspaceContent">
                    <!-- Dynamic Tool Content Loads Here -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- DATA CONFIGURATION ---
        const toolsData = {
            image: [
                { id: 'img-compress', name: 'Compress IMAGE', icon: 'fa-file-image' },
                { id: 'img-resize', name: 'Resize IMAGE', icon: 'fa-expand' },
                { id: 'img-crop', name: 'Crop IMAGE', icon: 'fa-crop-alt' },
                { id: 'img-upscale', name: 'Upscale IMAGE', icon: 'fa-arrow-up' },
                { id: 'img-bg', name: 'Remove Background', icon: 'fa-eraser' },
                { id: 'img-editor', name: 'Photo Editor', icon: 'fa-sliders-h' },
                { id: 'img-watermark', name: 'Watermark IMAGE', icon: 'fa-stamp' },
                { id: 'img-meme', name: 'Meme Generator', icon: 'fa-grin-squint' },
                { id: 'img-rotate', name: 'Rotate IMAGE', icon: 'fa-sync-alt' },
                { id: 'img-blur', name: 'Blur Face', icon: 'fa-user-secret' }
            ],
            pdf: [
                { id: 'pdf-merge', name: 'Merge PDF', icon: 'fa-object-group' },
                { id: 'pdf-split', name: 'Split PDF', icon: 'fa-cut' },
                { id: 'pdf-organize', name: 'Organize PDF Pages', icon: 'fa-sort-numeric-down' },
                { id: 'pdf-compress', name: 'Compress PDF', icon: 'fa-file-pdf' },
                { id: 'pdf-rotate', name: 'Rotate PDF', icon: 'fa-redo' },
                { id: 'pdf-protect', name: 'Protect PDF', icon: 'fa-lock' },
                { id: 'pdf-unlock', name: 'Unlock PDF', icon: 'fa-unlock' },
                { id: 'pdf-watermark', name: 'Watermark PDF', icon: 'fa-copyright' },
                { id: 'pdf-numbers', name: 'Page Numbers', icon: 'fa-list-ol' }
            ]
        };

        // --- DOM ELEMENTS ---
        const categorySelect = document.getElementById('categorySelect');
        const toolListContainer = document.getElementById('toolList');
        const currentToolTitle = document.getElementById('currentToolTitle');
        const workspaceContent = document.getElementById('workspaceContent');
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menuToggle');

        // --- FUNCTIONS ---

        function renderToolList(category) {
            toolListContainer.innerHTML = '';
            const tools = toolsData[category];

            tools.forEach((tool, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'tool-item';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'active_tool';
                radio.value = tool.name;
                radio.id = tool.id;

                // Create the visible card
                const card = document.createElement('label');
                card.className = 'tool-card';
                card.htmlFor = tool.id;
                card.innerHTML = `<i class="fas ${tool.icon} icon"></i> ${tool.name}`;

                // Event Listener
                radio.addEventListener('change', () => {
                    loadToolInterface(tool);
                    if(window.innerWidth <= 768) {
                        sidebar.classList.remove('active'); // Close mobile menu on select
                    }
                });

                itemDiv.appendChild(radio);
                itemDiv.appendChild(card);
                toolListContainer.appendChild(itemDiv);

                // Default Select First Item
                if (index === 0) {
                    radio.checked = true;
                    loadToolInterface(tool);
                }
            });
        }

        function loadToolInterface(tool) {
            currentToolTitle.innerText = tool.name;
            
            // Dynamic Interface Injection
            workspaceContent.innerHTML = `
                <div class="tool-interface">
                    <i class="fas ${tool.icon}" style="font-size: 48px; color: var(--primary-red); margin-bottom: 20px;"></i>
                    <h3>${tool.name}</h3>
                    <p style="color: #666; margin-bottom: 30px;">
                        Securely process your ${categorySelect.value.toUpperCase()} files locally in your browser.
                    </p>
                    
                    <div class="upload-zone" id="dropZone">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <p><strong>Choose file</strong> or drag it here</p>
                    </div>

                    <button class="btn-primary" onclick="alert('File processing logic would start here!')">
                        Upload & Process
                    </button>
                </div>
            `;
        }

        // --- EVENT LISTENERS ---

        categorySelect.addEventListener('change', (e) => {
            renderToolList(e.target.value);
        });

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        // --- INITIALIZATION ---
        // Start with Image tools
        renderToolList('image');

    </script>
</body>
</html>
